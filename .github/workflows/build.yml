name: build

on:
  push:
  pull_request:

jobs:
  windows-net48:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore .\AolaLoader.sln --locked-mode

      - name: Build
        run: dotnet build .\AolaLoader.sln -c Release --no-restore
